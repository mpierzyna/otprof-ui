# Server block for the app (the image's conf.d/default.conf; also usable on a plain nginx with root set to the build).
# The data directory is expected at <root>/data/.

# Hashed build assets are immutable; everything else (config, notes, data) is revalidated by ETag.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types application/json application/octet-stream text/markdown text/css text/javascript application/javascript image/svg+xml;

    # Locations below must not use add_header: nginx would drop these for them
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
    }
    # The app's own paths are one page. Only these: a missing data file stays a 404, not the page.
    location ~ ^/(forecast|climatology|license)(/|$) {
        try_files /index.html =404;
    }
    # Types missing from older mime.types; `types {}` replaces the whole table, hence per location
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
    }
    location ~ \.nc$ {
        types { }
        default_type application/x-netcdf; # compressed already: not gzipped again
    }
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
    }
}
