version = 1

# Files without room for a comment. The texts of the app (web/content) are rendered into the page, where a comment
# would end up in the title.
[[annotations]]
path = [
    ".gitignore",
    ".gitmodules",
    ".dockerignore",
    "CITATION.cff",
    "pipeline/.gitignore",
    "pipeline/.python-version",
    "pipeline/pyproject.toml",
    "pipeline/uv.lock",
    "web/.gitignore",
    "web/package.json",
    "web/package-lock.json",
    "web/tsconfig.json",
    "web/public/config.json",
    "web/content/*.md",
]
SPDX-FileCopyrightText = "2026 Maximilian Pierzyna"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The GitHub mark (Octicons mark-github-16, https://github.com/primer/octicons), unchanged: before the links to the
# OTProf repositories in the notes (style.css)
[[annotations]]
path = "web/src/github-mark.svg"
SPDX-FileCopyrightText = "2026 GitHub Inc."
SPDX-License-Identifier = "MIT"
