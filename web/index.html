<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><!--content:title:text--></title>
    <link rel="icon" href="data:," />
    <script src="/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <a id="home" class="brand" href="%BASE_URL%" title="Start over: newest forecast from now on, default view">
        <h1 id="title"><!--content:title:inline--></h1>
      </a>
      <p id="subtitle"><!--content:subtitle:inline--></p>
      <div id="theme-switch" class="segmented small theme-switch" role="group" aria-label="Colour theme">
        <button type="button" data-theme="system" title="Theme: as the system">
          <svg viewBox="0 0 24 24" aria-hidden="true"><!--icon:system--></svg>
        </button>
        <button type="button" data-theme="light" title="Theme: light">
          <svg viewBox="0 0 24 24" aria-hidden="true"><!--icon:light--></svg>
        </button>
        <button type="button" data-theme="dark" title="Theme: dark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><!--icon:dark--></svg>
        </button>
      </div>
    </header>
    <div class="tabbar">
      <nav id="mode-tabs" class="tabs" role="tablist" aria-label="View">
        <button type="button" role="tab" data-mode="forecast">Live forecast</button>
        <button type="button" role="tab" data-mode="climatology" hidden>Climatology</button>
        <button type="button" role="tab" data-page="licenses" class="tab-aside">Licenses</button>
      </nav>
      <div id="progress" class="progress" role="progressbar" aria-label="Loading" hidden><div></div></div>
    </div>

    <main class="layout">
      <details id="disclaimer" class="banner" role="note" hidden open>
        <summary>
          <svg class="banner-icon" viewBox="0 0 24 24" aria-hidden="true">
            <!--icon:warning-->
          </svg>
          <span id="disclaimer-title"><!--content:disclaimer:heading--></span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><!--icon:expand--></svg>
        </summary>
        <div id="disclaimer-text" class="markdown"><!--content:disclaimer:body--></div>
      </details>

      <div class="workspace">
        <section class="card controls" aria-label="What, when and where">
          <div class="controls-row">
            <div class="var-group">
              <div id="var-switch" class="segmented" role="group" aria-label="Variable"></div>
              <label class="filter-chip" id="log-values-group">
                <input id="log-values" type="checkbox" /> log₁₀
              </label>
            </div>
            <div id="cycle-group" class="field run-field">
              <label for="cycle-select">Forecast run</label>
              <div class="run-row">
                <div class="joined">
                  <select id="cycle-select"></select>
                  <button id="download" class="download-button" type="button" title="Download this forecast run as NetCDF" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><!--icon:download--></svg>
                    <span id="download-label">nc</span>
                  </button>
                </div>
                <button id="newer" class="newer-button" type="button" aria-label="Newer run" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <!--icon:update-->
                  </svg>
                  <span class="newer-text">Newer run</span>
                </button>
              </div>
            </div>
            <div class="field" id="stat-group" title="Statistic of the climatology on the map, in the profile and over the year" hidden>
              <span>Statistic</span>
              <div id="stat" class="stat-groups" role="group" aria-label="Statistic"></div>
            </div>
            <button id="clim-download" class="download-button standalone" type="button" title="Download the climatology as NetCDF" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><!--icon:download--></svg>
              <span id="clim-download-label">nc</span>
            </button>
          </div>
          <div class="controls-row">
            <div class="player">
              <button id="play" class="fab" type="button" aria-label="Play" title="Play / pause (space)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><!--icon:play#play-icon--></svg>
              </button>
              <button id="speed" class="chip-button" type="button" title="Playback speed (click to change)">1×</button>
            </div>
            <div class="slider">
              <label for="time" id="time-name">Time</label>
              <output id="time-label"></output>
              <input id="time" type="range" min="0" max="0" step="1" value="0" />
            </div>
            <div id="period" class="segmented" role="group" aria-label="Hours of the monthly statistics" hidden>
              <button type="button" data-period="global">All hours</button>
              <button type="button" data-period="day">Day</button>
              <button type="button" data-period="night">Night</button>
            </div>
          </div>
        </section>

        <div class="panels">
          <section class="card map-panel" aria-label="Map">
            <div id="map"></div>
            <div class="live-badge overlay" id="live-badge" title="The current hour of the newest forecast" hidden><span class="live-dot"></span>LIVE</div>
            <div class="map-spinner overlay" id="map-spinner" role="status" aria-label="Loading" hidden><span class="spinner"></span></div>
            <div class="height-overlay overlay" id="height-group" title="Height above ground (↑ ↓)">
              <label for="height">Height</label>
              <output id="height-label"></output>
              <input id="height" type="range" min="0" max="0" step="1" value="0" aria-orientation="vertical" />
            </div>
            <div class="map-legend overlay">
              <div id="colorbar" class="colorbar"></div>
              <label class="switch small" id="colour-z-group" title="Colour scale per height: log₁₀ Cₙ² spans orders of magnitude over the column">
                <input id="colour-z" type="checkbox" role="switch" /> Scale per height
              </label>
            </div>
            <div id="map-tooltip" class="tooltip" hidden></div>
          </section>

          <section class="card profile-panel" aria-label="Vertical profile">
            <div class="card-header">
              <div class="card-title-row">
                <div class="card-title">
                  <h2 id="profile-title">Profile</h2>
                  <span class="spinner" id="profile-spinner" role="status" aria-label="Loading" hidden></span>
                </div>
                <div class="title-actions">
                  <label class="filter-chip" title="Logarithmic height axis of the profile and the time-height plot">
                    <input id="log-height" type="checkbox" /> Log height
                  </label>
                  <button id="profile-csv" class="filter-chip" type="button" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><!--icon:download--></svg>
                    csv
                  </button>
                </div>
              </div>
              <div id="profile-sub" class="subheader"></div>
              <div id="column-values" class="chips"></div>
            </div>
            <div id="profile" class="plot-host"></div>
            <div id="profile-legend" class="legend"></div>
          </section>

          <section class="card th-panel" aria-label="Time-height plot">
            <div class="card-header">
              <div class="card-title-row">
                <div class="card-title">
                  <h2 id="th-title">Forecast at the selected point</h2>
                  <span class="spinner" id="th-spinner" role="status" aria-label="Loading" hidden></span>
                </div>
                <div id="th-kind" class="segmented small kind-switch" role="group" aria-label="Plot type" hidden>
                  <button type="button" data-kind="box">Box</button>
                  <button type="button" data-kind="violin">Violin</button>
                </div>
              </div>
            </div>
            <div id="timeheight"></div>
            <div id="th-colorbar" class="colorbar"></div>
            <div id="th-legend" class="legend"></div>
          </section>

          <section id="diurnal-panel" class="card diurnal-panel" aria-label="Diurnal cycle" hidden>
            <div class="card-header">
              <div class="card-title-row">
                <div class="card-title">
                  <h2 id="diurnal-title">Diurnal cycle</h2>
                  <span class="spinner" id="diurnal-spinner" role="status" aria-label="Loading" hidden></span>
                </div>
                <div id="diurnal-kind" class="segmented small kind-switch" role="group" aria-label="Plot type">
                  <button type="button" data-kind="box">Box</button>
                  <button type="button" data-kind="violin">Violin</button>
                </div>
              </div>
            </div>
            <div id="diurnal"></div>
            <div id="diurnal-colorbar" class="colorbar"></div>
            <div id="diurnal-legend" class="legend"></div>
          </section>
        </div>
      </div>

      <section class="card notes-panel" aria-labelledby="notes-title">
        <article id="notes" class="markdown">
          <div class="notes-head">
            <h2 id="notes-title">What am I seeing?</h2>
            <button id="info-button" class="info-button" type="button" popovertarget="info-popover" title="Details of the data shown" aria-label="Details of the data shown">
              <svg viewBox="0 0 24 24" aria-hidden="true"><!--icon:info--></svg>
            </button>
          </div>
          <div id="notes-live"><!--content:forecast--></div>
          <div id="notes-clim" hidden><!--content:climatology--></div>
          <div id="notes-data"></div>
          <!--content:about-->
        </article>
        <div id="info-popover" class="info-popover" popover aria-labelledby="info-title">
          <h3 id="info-title">Details</h3>
          <dl id="info" class="info"></dl>
        </div>
      </section>
    </main>

    <main id="licenses-page" class="page" hidden>
      <article class="card markdown page-text">
        <!--content:licenses-->
        <section id="third-party" aria-label="Third-party software"></section>
      </article>
    </main>

    <footer class="footer"><!--content:footer:inline--></footer>
    <div id="error" class="snackbar" hidden></div>
    <dialog id="download-dialog" class="dialog" aria-labelledby="download-title">
      <h2 id="download-title"><!--content:download:heading--></h2>
      <p id="download-what" class="dialog-what"></p>
      <div class="dialog-warning">
        <svg class="banner-icon" viewBox="0 0 24 24" aria-hidden="true">
          <!--icon:warning-->
        </svg>
        <div class="markdown">
          <h3><!--content:disclaimer:heading--></h3>
          <!--content:disclaimer:body-->
        </div>
      </div>
      <div class="dialog-accept"><!--content:download:body--></div>
      <form method="dialog" class="dialog-actions">
        <button type="submit" class="secondary-button">Cancel</button>
        <span id="download-links" class="dialog-links"></span>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
